services:
  - type: web
    name: tanzania-famtour
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_ORIGIN
        value: "*"
      - key: PREVIEW_MODE
        value: "false"
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
